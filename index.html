<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures P/L Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Futures Trading P/L Calculator</h2>
        <label>Entry Price:</label>
        <input type="number" id="entryPrice" placeholder="Enter Entry Price">

        <label>Exit Price:</label>
        <input type="number" id="exitPrice" placeholder="Enter Exit Price">

        <label>Leverage (e.g., 10x):</label>
        <input type="number" id="leverage" placeholder="Enter Leverage">

        <label>Position Size (USD):</label>
        <input type="number" id="positionSize" placeholder="Enter Position Size">

        <button onclick="calculatePL()">Calculate P/L</button>

        <h3 id="result"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
