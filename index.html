<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures Trading Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Futures Trading Calculator</h2>

        <label for="tradeType">Trade Type:</label>
        <select id="tradeType">
            <option value="long">Long</option>
            <option value="short">Short</option>
        </select>

        <label for="entryPrice">Entry Price:</label>
        <input type="number" id="entryPrice" placeholder="Enter Entry Price">

        <label for="exitPrice">Exit Price:</label>
        <input type="number" id="exitPrice" placeholder="Enter Exit Price">

        <label for="leverage">Leverage (e.g., 10):</label>
        <input type="number" id="leverage" placeholder="Enter Leverage">

        <label for="margin">Margin (Amount Invested):</label>
        <input type="number" id="margin" placeholder="Enter Margin Amount">

        <button id="calculateBtn">Calculate</button>

        <div class="results">
            <p id="profitLoss">Profit/Loss: $0.00</p>
            <p id="liquidationPrice">Liquidation Price: $0.00</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
